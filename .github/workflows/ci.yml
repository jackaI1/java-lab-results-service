name: Maven and Compose
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test with PostgreSQL containers and package
        run: ./mvnw -B verify
      - name: Start synthetic demo
        run: |
          ./scripts/setup-demo.sh
          docker compose -p lab-ci up --build --wait --wait-timeout 180
      - name: Exercise HTTP workflow
        run: ./scripts/demo.sh
      - name: Stop demo containers and volumes
        if: always()
        run: docker compose -p lab-ci down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: target/surefire-reports/*.xml
