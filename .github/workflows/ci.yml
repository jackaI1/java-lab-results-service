name: Maven and Compose
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify-${{ matrix.database }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgresql
            tests: FhirExporterTest,LabResultsIntegrationTest
            compose: -p lab-ci-pg -f compose.yaml
          - database: mysql
            tests: FhirExporterTest,MySqlIntegrationTest
            compose: -p lab-ci-mysql -f compose.yaml -f compose.mysql.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test with real database container and package
        run: ./mvnw -B -Duser.timezone=America/Toronto -Dtest=${{ matrix.tests }} verify
      - name: Start synthetic demo
        run: |
          ./scripts/setup-demo.sh
          docker compose ${{ matrix.compose }} up --build --wait --wait-timeout 180
      - name: Exercise HTTP workflow
        run: ./scripts/demo.sh
      - name: Stop demo containers and volumes
        if: always()
        run: docker compose ${{ matrix.compose }} down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-${{ matrix.database }}
          path: target/surefire-reports/*.xml
